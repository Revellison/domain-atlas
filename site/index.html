<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Домены, IPv4, диапазоны и операторы сетей.">
  <title>Домены · Domain Atlas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="icon-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10m-7 6h4"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="icon-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
    <symbol id="icon-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-external" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-9 9m6-1v6H5V8h6"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></symbol>
  </svg>
  <main>
    <header class="page-header">
      <div class="page-title">
        <span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="#icon-globe"/></svg></span>
        <h1>Домены</h1>
      </div>
      <div class="snapshot" id="snapshot" hidden>
        <span id="snapshot-source"></span>
        <span class="snapshot-date"><svg class="icon" aria-hidden="true"><use href="#icon-clock"/></svg><time id="snapshot-date"></time></span>
      </div>
    </header>
    <div class="notice" id="snapshot-notice" hidden>
      <svg class="icon" aria-hidden="true"><use href="#icon-info"/></svg><span id="snapshot-warning"></span>
    </div>
    <form class="toolbar" id="filters" role="search" aria-label="Поиск и фильтры доменов">
      <label class="search-field">
        <span class="sr-only">Поиск по домену, IP, диапазону, ASN или оператору</span>
        <svg class="icon field-icon" aria-hidden="true"><use href="#icon-search"/></svg>
        <input id="search" type="search" placeholder="Домен, IP, ASN или оператор…" autocomplete="off" spellcheck="false">
      </label>
      <div class="provider-control">
        <button id="provider-toggle" class="filter-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="provider-popup" disabled>
          <svg class="icon" aria-hidden="true"><use href="#icon-server"/></svg>
          <span id="provider-label">Все хостеры</span>
          <svg class="icon chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
        </button>
        <section id="provider-popup" class="provider-popup" role="dialog" aria-label="Выбор хостера" hidden>
          <div class="popup-heading">
            <span>Хостеры и операторы</span>
            <button id="provider-close" type="button" class="icon-button" aria-label="Закрыть список хостеров"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button>
          </div>
          <label class="search-field provider-search">
            <span class="sr-only">Найти хостера по имени или ASN</span>
            <svg class="icon field-icon" aria-hidden="true"><use href="#icon-search"/></svg>
            <input id="provider-search" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="provider-options" placeholder="Хостер или ASN…" autocomplete="off" spellcheck="false">
          </label>
          <div id="provider-options" class="host-list" role="listbox" aria-label="Хостеры"></div>
          <div class="host-pagination">
            <span id="host-count" role="status"></span>
            <div>
              <button id="host-previous" type="button" class="icon-button" aria-label="Предыдущие хостеры"><svg class="icon" aria-hidden="true"><use href="#icon-left"/></svg></button>
              <button id="host-next" type="button" class="icon-button" aria-label="Следующие хостеры"><svg class="icon" aria-hidden="true"><use href="#icon-right"/></svg></button>
            </div>
          </div>
        </section>
      </div>
      <label class="select-field status-field">
        <span class="sr-only">Тип доменов</span>
        <svg class="icon field-icon" aria-hidden="true"><use href="#icon-filter"/></svg>
        <select id="status">
          <option value="all">Все домены</option>
          <option value="resolved">С IP</option>
          <option value="unresolved">Без IP</option>
          <option value="multi">Несколько IP</option>
          <option value="cdn">CDN</option>
          <option value="subdomain">Поддомены</option>
        </select>
        <svg class="icon chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
      </label>
      <span id="result-count" class="result-count" role="status"></span>
      <button id="reset" class="reset-button" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>Сбросить</button>
    </form>
    <section class="results" aria-label="Домены и сети">
      <div class="table-scroll" id="table-scroll">
        <table class="domain-table" role="table">
          <caption class="sr-only">Домены сгруппированы по оператору и ASN. Откройте подробности домена, чтобы увидеть все IP-адреса.</caption>
          <thead role="rowgroup">
            <tr role="row">
              <th scope="col" role="columnheader">Домен</th>
              <th scope="col" role="columnheader">IPv4</th>
              <th scope="col" role="columnheader">Диапазон / BGP</th>
              <th scope="col" role="columnheader">ASN / оператор</th>
              <th scope="col" role="columnheader">Сайт оператора</th>
            </tr>
          </thead>
          <tbody id="rows" role="rowgroup"><tr role="row"><td colspan="5" class="empty" role="status">Загружаем домены…</td></tr></tbody>
        </table>
      </div>
      <nav id="pagination" class="pagination" aria-label="Страницы доменов" hidden>
        <span id="page-summary" role="status"></span>
        <div class="pagination-controls">
          <div class="page-size">
            <label for="page-size">На странице</label>
            <span class="select-field">
              <select id="page-size"><option value="25">25</option><option value="50">50</option><option value="100">100</option></select>
              <svg class="icon chevron" aria-hidden="true"><use href="#icon-chevron"/></svg>
            </span>
          </div>
          <div class="page-navigation" id="page-navigation">
            <button id="previous" type="button" class="icon-button" aria-label="Предыдущая страница" disabled><svg class="icon" aria-hidden="true"><use href="#icon-left"/></svg></button>
            <div id="page-numbers"></div>
            <span id="page-count"></span>
            <button id="next" type="button" class="icon-button" aria-label="Следующая страница" disabled><svg class="icon" aria-hidden="true"><use href="#icon-right"/></svg></button>
          </div>
        </div>
      </nav>
    </section>
  </main>
</body>
</html>
